<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2>X-Ray Vision</h2>

    <div class="control-group">
      <label class="switch">
        <input type="checkbox" id="toggleXray">
        <span class="slider round"></span>
      </label>
      <span>Activer X-Ray</span>
    </div>

    <div class="control-group">
      <label>Opacité: <span id="opacityValue">0.5</span></label>
      <input type="range" id="opacityRange" min="0" max="1" step="0.1" value="0.5">
    </div>

    <div class="control-group">
      <button id="toggleSelection">Mode Sélection Manuelle</button>
      <p id="selectionStatus">Inactif</p>
    </div>

    <p class="hint">Cliquez sur un élément en mode sélection pour le rendre transparent.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
