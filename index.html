<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutoHub - IA, Crypto, Streaming & Business</title>
    <meta name="description" content="Plateforme de tutoriels experts et services digitaux : IA, Cryptomonnaie, Streaming et Business.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* --- BLOC 2 : CSS --- */
        :root {
            --bg-main: #000000;
            --bg-card: #0a0a0a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #6366f1;
            --accent-hover: #4f46e5;

            --cat-ia: #3b82f6;
            --cat-crypto: #f59e0b;
            --cat-streaming: #ef4444;
            --cat-business: #10b981;
            --cat-services: #a855f7;
            --cat-section: #ec4899;

            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* --- HEADER --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid #1a1a1a;
            height: 70px;
            display: flex;
            align-items: center;
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-links a {
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .nav-links a:hover, .nav-links a.active {
            color: #fff;
        }

        .search-container {
            position: relative;
            margin-right: 1.5rem;
        }

        .search-container input {
            background: #111;
            border: 1px solid #222;
            color: #fff;
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            border-radius: 8px;
            outline: none;
            width: 200px;
            transition: var(--transition);
        }

        .search-container input:focus {
            border-color: var(--accent);
            width: 260px;
            background: #161616;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #555;
            font-size: 0.9rem;
        }

        .burger {
            display: none;
            flex-direction: column;
            gap: 6px;
        }

        .burger span {
            width: 28px;
            height: 2px;
            background-color: #fff;
            transition: var(--transition);
        }

        /* --- HERO --- */
        .hero {
            padding: 140px 0 60px;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            margin-bottom: 1.5rem;
            font-weight: 900;
            line-height: 1.1;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 650px;
            margin: 0 auto;
        }

        /* --- FILTERS --- */
        .filters {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 4rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-muted);
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-btn:hover {
            color: #fff;
            border-color: #333;
        }

        .filter-btn.active {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        /* --- GRID --- */
        .article-grid {
            display: grid;
            gap: 2.5rem;
            margin-bottom: 6rem;
        }

        @media (min-width: 640px) { .article-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { .article-grid { grid-template-columns: repeat(3, 1fr); } }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #111;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.1);
        }

        .card-img {
            height: 220px;
            background-color: #0a0a0a;
            background-size: cover;
            background-position: center;
            filter: grayscale(20%);
            transition: var(--transition);
        }

        .card:hover .card-img {
            filter: grayscale(0%);
        }

        .card-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .badge {
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 800;
            padding: 0.3rem 0.7rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: inline-block;
            width: fit-content;
            letter-spacing: 1px;
        }

        .badge-ia { background: var(--cat-ia); color: white; }
        .badge-crypto { background: var(--cat-crypto); color: white; }
        .badge-streaming { background: var(--cat-streaming); color: white; }
        .badge-business { background: var(--cat-business); color: white; }
        .badge-services { background: var(--cat-services); color: white; }
        .badge-section { background: var(--cat-section); color: white; }

        .card-title {
            font-size: 1.25rem;
            margin-bottom: 0.75rem;
            line-height: 1.3;
            font-weight: 700;
        }

        .card-resume {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #1a1a1a;
            padding-top: 1rem;
        }

        .card-date {
            font-size: 0.8rem;
            color: #444;
        }

        /* --- DETAIL VIEW --- */
        #list-view { display: block; }
        #article-view {
            display: none;
            padding: 120px 0 80px;
            max-width: 800px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 3rem;
            color: var(--accent);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            transition: var(--transition);
        }

        .back-btn:hover { color: #fff; }

        .article-main-img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 3rem;
            max-height: 500px;
            object-fit: cover;
            border: 1px solid #1a1a1a;
        }

        .article-content h2 { margin: 3rem 0 1.5rem; color: white; font-size: 1.8rem; font-weight: 800; }
        .article-content p { margin-bottom: 1.5rem; color: #aaa; font-size: 1.1rem; }
        .article-content ul { margin-bottom: 1.5rem; padding-left: 1.5rem; color: #aaa; }
        .article-content li { margin-bottom: 0.5rem; }
        .article-content pre { background: #050505; padding: 1.5rem; border-radius: 8px; overflow-x: auto; margin: 2rem 0; border: 1px solid #1a1a1a; }
        .article-content code { font-family: 'Fira Code', monospace; color: #fff; }

        .price-tag {
            font-size: 2.5rem;
            font-weight: 900;
            color: #fff;
            margin: 2rem 0;
            display: block;
        }

        .cta-button {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: 1.2rem 3rem;
            border-radius: 8px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 1rem;
            transition: var(--transition);
        }

        .cta-button:hover {
            background: var(--accent-hover);
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        /* --- FOOTER --- */
        footer {
            padding: 5rem 0;
            border-top: 1px solid #1a1a1a;
            text-align: center;
            color: #333;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #back-to-top {
            position: fixed;
            bottom: 3rem;
            right: 3rem;
            background: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            color: #000;
            z-index: 99;
            font-weight: 900;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        #back-to-top.visible { opacity: 1; visibility: visible; }

        /* --- MOBILE NAV --- */
        .mobile-nav {
            position: fixed;
            top: 70px;
            left: 0;
            width: 100%;
            height: 0;
            background: #000;
            overflow: hidden;
            transition: var(--transition);
            z-index: 999;
            display: flex;
            flex-direction: column;
            padding: 0 20px;
        }

        .mobile-nav.open {
            height: calc(100vh - 70px);
            padding: 40px 20px;
        }

        .mobile-nav a {
            font-size: 1.5rem;
            font-weight: 700;
            padding: 15px 0;
            border-bottom: 1px solid #1a1a1a;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .burger { display: flex; }
            .search-container input { width: 140px; }
            .search-container input:focus { width: 180px; }
            .hero { padding: 120px 0 40px; }
            #back-to-top { bottom: 1.5rem; right: 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container nav-wrapper">
            <a href="#" class="logo" onclick="home(event)">TutoHub</a>

            <div style="display: flex; align-items: center;">
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="RECHERCHE">
                </div>

                <nav class="nav-links">
                    <a href="#" onclick="filterBy('ia', event)">IA</a>
                    <a href="#" onclick="filterBy('crypto', event)">Crypto</a>
                    <a href="#" onclick="filterBy('streaming', event)">Streaming</a>
                    <a href="#" onclick="filterBy('business', event)">Business</a>
                    <a href="#" onclick="filterBy('services', event)">Services</a>
                    <a href="#" onclick="filterBy('section', event)">Section</a>
                </nav>

                <button class="burger" id="burger-btn" onclick="toggleMenu()">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <div class="mobile-nav" id="mobile-nav">
        <a href="#" onclick="filterBy('ia', event)">IA</a>
        <a href="#" onclick="filterBy('crypto', event)">Crypto</a>
        <a href="#" onclick="filterBy('streaming', event)">Streaming</a>
        <a href="#" onclick="filterBy('business', event)">Business</a>
        <a href="#" onclick="filterBy('services', event)">Services</a>
        <a href="#" onclick="filterBy('section', event)">Section</a>
    </div>

    <main class="container">
        <section id="list-view">
            <div class="hero">
                <h1>Apprenez le Futur</h1>
                <p>Expertise et solutions digitales pour l'ère de l'intelligence.</p>
            </div>

            <div class="filters">
                <button class="filter-btn active" onclick="filterBy('all', event)">Tous</button>
                <button class="filter-btn" onclick="filterBy('ia', event)">IA</button>
                <button class="filter-btn" onclick="filterBy('crypto', event)">Crypto</button>
                <button class="filter-btn" onclick="filterBy('streaming', event)">Streaming</button>
                <button class="filter-btn" onclick="filterBy('business', event)">Business</button>
                <button class="filter-btn" onclick="filterBy('services', event)">Services</button>
                <button class="filter-btn" onclick="filterBy('section', event)">Section</button>
            </div>

            <div class="article-grid" id="article-grid"></div>
        </section>

        <section id="article-view">
            <button class="back-btn" onclick="home(event)">← RETOUR AUX ARTICLES</button>
            <div id="article-content"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 TutoHub. TOUS DROITS RÉSERVÉS.</p>
    </footer>

    <button id="back-to-top" onclick="window.scrollTo({top:0, behavior:'smooth'})">↑</button>

    <script>
        /* --- BLOC 3 : JS --- */
        const articles = [
            {
                id: 1,
                titre: "Compte TikTok Monétisé",
                categorie: "services",
                date: "2026-05-24",
                resume: "Accédez instantanément à la monétisation TikTok avec un compte pré-configuré et prêt à l'emploi.",
                image: "https://images.unsplash.com/photo-1611605698335-8b1c4367c2cd?auto=format&fit=crop&w=800&q=80",
                contenu: `
                    <h2>Détails du Service</h2>
                    <p>Ce compte TikTok a été rigoureusement préparé pour répondre aux critères de monétisation. Vous pouvez commencer à générer des revenus dès votre première vidéo virale.</p>
                    <span class="price-tag">3500 FCFA</span>
                    <a href="https://wa.me/2290198905311?text=Bonjour,%20je%20souhaite%20commander%20un%20compte%20TikTok%20monétisé" class="cta-button">COMMANDER</a>
                `
            },
            {
                id: 2,
                titre: "PayPal Vérifié (Afrique)",
                categorie: "services",
                date: "2026-05-24",
                resume: "Recevez vos paiements internationaux sans limites avec un compte PayPal totalement vérifié.",
                image: "https://images.unsplash.com/photo-1580519542036-c47de6196ba5?auto=format&fit=crop&w=800&q=80",
                contenu: `
                    <h2>Détails du Service</h2>
                    <p>Solution idéale pour les freelances et entrepreneurs en Afrique. Envoyez et recevez de l'argent en toute sécurité.</p>
                    <span class="price-tag">4500 FCFA</span>
                    <a href="https://wa.me/2290198905311?text=Bonjour,%20je%20souhaite%20commander%20un%20compte%20PayPal%20vérifié" class="cta-button">COMMANDER</a>
                `
            },
            {
                id: 3,
                titre: "Compte Facebook Monétisé",
                categorie: "services",
                date: "2026-05-24",
                resume: "Exploitez la puissance des publicités Facebook avec un compte éligible aux revenus publicitaires.",
                image: "https://images.unsplash.com/photo-1611162616305-c69b3fa7fbe0?auto=format&fit=crop&w=800&q=80",
                contenu: `
                    <h2>Détails du Service</h2>
                    <p>Générez des revenus passifs grâce à vos contenus vidéos sur Facebook.</p>
                    <span class="price-tag">3000 FCFA</span>
                    <a href="https://wa.me/2290198905311?text=Bonjour,%20je%20souhaite%20commander%20un%20compte%20Facebook%20monétisé" class="cta-button">COMMANDER</a>
                `
            },
            {
                id: 4,
                titre: "Compte Instagram Monétisé",
                categorie: "services",
                date: "2026-05-24",
                resume: "Prêt pour les collaborations marques et les bonus Instagram.",
                image: "https://images.unsplash.com/photo-1611162618071-b39a2dd7d5d8?auto=format&fit=crop&w=800&q=80",
                contenu: `
                    <h2>Détails du Service</h2>
                    <p>Un compte avec un bon historique pour booster votre carrière d'influenceur ou votre business.</p>
                    <span class="price-tag">4000 FCFA</span>
                    <a href="https://wa.me/2290198905311?text=Bonjour,%20je%20souhaite%20commander%20un%20compte%20Instagram%20monétisé" class="cta-button">COMMANDER</a>
                `
            },
            {
                id: 5,
                titre: "Open Source Projects",
                categorie: "section",
                date: "2026-05-20",
                resume: "Explorez nos contributions à la communauté open source.",
                image: "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=800&q=80",
                contenu: `
                    <h2>Nos Projets</h2>
                    <p>Retrouvez une sélection de bibliothèques et d'outils disponibles gratuitement sur GitHub.</p>
                    <ul>
                        <li>AI Automator Core</li>
                        <li>Crypto Tracker UI</li>
                        <li>Streaming Overlay Kit</li>
                    </ul>
                `
            },
            {
                id: 6,
                titre: "Documentation Technique",
                categorie: "section",
                date: "2026-05-19",
                resume: "Guides complets et documentations pour tous nos outils.",
                image: "https://images.unsplash.com/photo-1456324504439-367cee3b3c32?auto=format&fit=crop&w=800&q=80",
                contenu: `
                    <h2>Guides & Docs</h2>
                    <p>Tout ce dont vous avez besoin pour configurer et utiliser nos solutions avec succès.</p>
                `
            },
            {
                id: 7,
                titre: "Code Gists",
                categorie: "section",
                date: "2026-05-18",
                resume: "Snippets et astuces de code rapides pour vos projets.",
                image: "https://images.unsplash.com/photo-1542831371-29b0f74f9713?auto=format&fit=crop&w=800&q=80",
                contenu: `
                    <h2>Snippets</h2>
                    <p>Une collection de solutions prêtes à l'emploi pour les problèmes de développement courants.</p>
                `
            }
        ];

        let currentFilter = 'all';
        let searchQuery = '';

        const grid = document.getElementById('article-grid');
        const listView = document.getElementById('list-view');
        const articleView = document.getElementById('article-view');
        const content = document.getElementById('article-content');
        const searchInput = document.getElementById('search-input');
        const mobileNav = document.getElementById('mobile-nav');

        function render() {
            const filtered = articles.filter(a => {
                const mFilter = currentFilter === 'all' || a.categorie === currentFilter;
                const mSearch = a.titre.toLowerCase().includes(searchQuery.toLowerCase()) ||
                               a.resume.toLowerCase().includes(searchQuery.toLowerCase());
                return mFilter && mSearch;
            }).sort((a,b) => new Date(b.date) - new Date(a.date));

            grid.innerHTML = filtered.map(a => `
                <div class="card" onclick="viewArticle(${a.id})">
                    <div class="card-img" style="background-image:url('${a.image}')"></div>
                    <div class="card-content">
                        <span class="badge badge-${a.categorie}">${a.categorie}</span>
                        <h2 class="card-title">${a.titre}</h2>
                        <p class="card-resume">${a.resume}</p>
                        <div class="card-footer">
                            <span class="card-date">${new Date(a.date).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })}</span>
                            <span style="color:var(--accent); font-weight:700; font-size:0.8rem">LIRE PLUS →</span>
                        </div>
                    </div>
                </div>
            `).join('') || '<div style="grid-column:1/-1;text-align:center;padding:5rem;"><p style="color:#444;font-weight:700;text-transform:uppercase;letter-spacing:1px;">AUCUN CONTENU DISPONIBLE POUR LE MOMENT.</p></div>';
        }

        function viewArticle(id) {
            const a = articles.find(x => x.id === id);
            content.innerHTML = `
                <span class="badge badge-${a.categorie}">${a.categorie}</span>
                <h1 style="margin:1rem 0; font-size: clamp(2rem, 5vw, 3rem); font-weight:800; line-height:1.2;">${a.titre}</h1>
                <div style="color:var(--text-muted); margin-bottom: 2rem;">Publié le ${new Date(a.date).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })}</div>
                <img src="${a.image}" class="article-main-img">
                <div class="article-content">${a.contenu}</div>
            `;
            listView.style.display = 'none';
            articleView.style.display = 'block';
            window.scrollTo(0,0);
        }

        function home(e) {
            if(e) e.preventDefault();
            articleView.style.display = 'none';
            listView.style.display = 'block';
            window.scrollTo(0,0);
        }

        function filterBy(cat, e) {
            if(e) e.preventDefault();
            currentFilter = cat;

            document.querySelectorAll('.filter-btn').forEach(b => {
                const text = b.innerText.toLowerCase();
                if(cat === 'all' && text === 'tous') b.classList.add('active');
                else if(text === cat) b.classList.add('active');
                else b.classList.remove('active');
            });

            if(mobileNav.classList.contains('open')) toggleMenu();
            home(); render();
        }

        function toggleMenu() {
            mobileNav.classList.toggle('open');
            const spans = document.getElementById('burger-btn').querySelectorAll('span');
            if (mobileNav.classList.contains('open')) {
                spans[0].style.transform = 'rotate(45deg) translate(5px, 6px)';
                spans[1].style.opacity = '0';
                spans[2].style.transform = 'rotate(-45deg) translate(5px, -6px)';
            } else {
                spans[0].style.transform = 'none';
                spans[1].style.opacity = '1';
                spans[2].style.transform = 'none';
            }
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            render();
        });

        window.onscroll = () => {
            document.getElementById('back-to-top').classList.toggle('visible', window.scrollY > 400);
        };

        render();
    </script>
</body>
</html>
