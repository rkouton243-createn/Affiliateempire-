<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ARAKFORUM - Politique Anonyme</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #8b5cf6;
      --bg: #000000;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --text-muted: #a1a1aa;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    h1, h2, h3 {
      font-family: 'Playfair Display', serif;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(to right, #fff, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .nav {
      display: flex;
      gap: 24px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 12px;
    }

    .nav a {
      color: var(--text-muted);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
      position: relative;
    }

    .nav a:hover {
      color: var(--primary);
    }

    .nav a.active {
      color: var(--text);
    }

    .nav a.active::after {
      content: '';
      position: absolute;
      bottom: -13px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--primary);
      box-shadow: 0 0 10px var(--primary);
    }

    .section {
      display: none;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section.active {
      display: block;
    }

    .post {
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 20px;
      margin: 16px 0;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      transition: border-color 0.3s ease;
    }

    .post:hover {
      border-color: rgba(139, 92, 246, 0.3);
    }

    .pseudo {
      color: var(--primary);
      font-weight: 600;
      margin-right: 8px;
    }

    input, textarea {
      width: 100%;
      padding: 12px 16px;
      margin: 8px 0;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: #fff;
      font-family: inherit;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.08);
    }

    button {
      padding: 12px 24px;
      background: var(--primary);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(139, 92, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
    }

    .btn-glow {
      position: relative;
      overflow: hidden;
    }

    .btn-glow::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        transparent,
        transparent,
        transparent,
        var(--primary)
      );
      animation: rotate 4s linear infinite;
      z-index: -2;
    }

    .btn-glow::after {
      content: '';
      position: absolute;
      inset: 2px;
      background: var(--primary);
      border-radius: 6px;
      z-index: -1;
    }

    @keyframes rotate {
      100% { transform: rotate(1turn); }
    }

    .btn-glow:hover::after {
      background: #9d76f7;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ARAKFORUM - Politique</h1>
    <p class="subtitle">Discutez anonymement de politique (Afrique & Monde)</p>

    <!-- Navigation -->
    <div class="nav">
      <a onclick="showSection('accueil')" id="nav-accueil">Accueil</a>
      <a onclick="showSection('chat')" id="nav-chat">Chat 🐱</a>
    </div>

    <!-- Sections -->
    <div id="accueil" class="section active">
      <h2>Fil d'actualité</h2>
      <textarea id="newPostAccueil" placeholder="Écris un post..."></textarea>
      <button onclick="addPost('accueil')" class="btn-glow">Poster</button>
      <div id="postsAccueil"></div>
    </div>

    <div id="chat" class="section">
      <h2>Chat 🐱</h2>
      <input id="newMsgChat" placeholder="Écris un message...">
      <button onclick="addPost('chat')" class="btn-glow">Envoyer</button>
      <div id="postsChat"></div>
    </div>
  </div>

  <script>
    // Génère un pseudo aléatoire
    function getPseudo() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      let pseudo = '';
      for (let i = 0; i < 8; i++) {
        pseudo += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return pseudo;
    }

    // Affiche une section
    function showSection(id) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.getElementById('nav-' + id).classList.add('active');
    }

    // Chargement initial des données
    let data = JSON.parse(localStorage.getItem('arakforum_data')) || { accueil: [], chat: [] };

    function renderPosts() {
      ['accueil', 'chat'].forEach(type => {
        const postsDiv = document.getElementById(type === 'accueil' ? 'postsAccueil' : 'postsChat');
        postsDiv.innerHTML = '';
        data[type].forEach(item => {
          const postContainer = document.createElement('div');
          postContainer.className = 'post';

          const pseudoSpan = document.createElement('span');
          pseudoSpan.className = 'pseudo';
          pseudoSpan.textContent = item.pseudo;

          postContainer.appendChild(pseudoSpan);
          postContainer.appendChild(document.createTextNode(': ' + item.text));

          postsDiv.appendChild(postContainer);
        });
      });
    }

    // Initial render
    renderPosts();
    document.getElementById('nav-accueil').classList.add('active');

    // Ajoute un post
    function addPost(type) {
      const inputId = type === 'accueil' ? 'newPostAccueil' : 'newMsgChat';
      const input = document.getElementById(inputId);
      const text = input.value.trim();
      if (!text) return;

      const pseudo = getPseudo();
      const newItem = { pseudo, text, timestamp: Date.now() };

      data[type].unshift(newItem);
      localStorage.setItem('arakforum_data', JSON.stringify(data));

      renderPosts();
      input.value = '';
    }
  </script>
</body>
</html>
