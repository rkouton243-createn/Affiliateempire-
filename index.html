<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutoHub - IA, Crypto, Streaming & Business</title>
    <meta name="description" content="Plateforme de tutoriels sur l'IA, la Cryptomonnaie, le Streaming et le Business en ligne.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- CSS VARIABLES --- */
        :root {
            --bg-main: #0f0f0f;
            --bg-card: #1e1e2e;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;

            --cat-ia: #3b82f6;
            --cat-crypto: #f59e0b;
            --cat-streaming: #ef4444;
            --cat-business: #10b981;

            --transition: all 0.3s ease;
        }

        /* --- BASE STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        button {
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
            color: inherit;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* --- HEADER & NAV --- */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 0;
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-links a {
            font-weight: 500;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent);
        }

        .search-container {
            position: relative;
            margin-left: 1rem;
        }

        .search-container input {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 0.5rem 1rem 0.5rem 2.5rem;
            border-radius: 99px;
            outline: none;
            width: 200px;
            transition: var(--transition);
        }

        .search-container input:focus {
            border-color: var(--accent);
            width: 250px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* --- BURGER MENU --- */
        .burger {
            display: none;
            flex-direction: column;
            gap: 5px;
        }

        .burger span {
            width: 25px;
            height: 2px;
            background-color: var(--text-main);
            transition: var(--transition);
        }

        /* --- HERO --- */
        .hero {
            padding: 4rem 0;
            text-align: center;
            background: radial-gradient(circle at center, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
        }

        /* --- FILTERS --- */
        .filters {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 600;
            transition: var(--transition);
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* --- ARTICLE GRID --- */
        .article-grid {
            display: grid;
            gap: 2rem;
            margin-bottom: 4rem;
        }

        /* Responsive Grid: 1 col mobile, 2 col tablet, 3 col desktop */
        @media (min-width: 640px) {
            .article-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (min-width: 1024px) {
            .article-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .card-img {
            height: 200px;
            background-color: #2a2a3a;
            background-size: cover;
            background-position: center;
        }

        .card-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
        }

        .badge-ia { background-color: var(--cat-ia); color: white; }
        .badge-crypto { background-color: var(--cat-crypto); color: white; }
        .badge-streaming { background-color: var(--cat-streaming); color: white; }
        .badge-business { background-color: var(--cat-business); color: white; }

        .card-date {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .card-title {
            font-size: 1.25rem;
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }

        .card-resume {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        /* --- ARTICLE DETAIL --- */
        #article-view {
            display: none;
            padding-bottom: 4rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            color: var(--accent);
            font-weight: 600;
        }

        .article-header {
            margin-bottom: 2rem;
        }

        .article-full-content h2 {
            margin: 2rem 0 1rem;
        }

        .article-full-content p {
            margin-bottom: 1.2rem;
        }

        .article-full-content pre {
            background: #000;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .article-full-content code {
            font-family: 'Courier New', Courier, monospace;
            color: var(--cat-ia);
        }

        /* --- FOOTER --- */
        footer {
            padding: 3rem 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
        }

        .copyright {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* --- BACK TO TOP --- */
        #back-to-top {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--accent);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            z-index: 99;
        }

        #back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }

        /* --- MOBILE MENU --- */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: var(--bg-main);
                flex-direction: column;
                padding: 2rem;
                gap: 1.5rem;
                text-align: center;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }

            .nav-links.show {
                display: flex;
            }

            .burger {
                display: flex;
            }

            .search-container {
                margin-left: 0;
                margin-right: 1rem;
            }

            .search-container input {
                width: 150px;
            }

            .search-container input:focus {
                width: 180px;
            }

            .hero h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="container nav-wrapper">
            <a href="#" class="logo" onclick="home()">TutoHub</a>

            <div style="display: flex; align-items: center;">
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="Rechercher...">
                </div>

                <nav class="nav-links" id="mobile-menu">
                    <a href="#" onclick="filterBy('ia')">IA</a>
                    <a href="#" onclick="filterBy('crypto')">Crypto</a>
                    <a href="#" onclick="filterBy('streaming')">Streaming</a>
                    <a href="#" onclick="filterBy('business')">Business</a>
                </nav>

                <button class="burger" id="burger-menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">

        <!-- ListView Section -->
        <section id="list-view">
            <div class="hero">
                <h1>Apprenez le Futur</h1>
                <p>Tutoriels experts en Intelligence Artificielle, Crypto, Streaming et Business en ligne.</p>
            </div>

            <div class="filters">
                <button class="filter-btn active" onclick="filterBy('all')">Tous</button>
                <button class="filter-btn" onclick="filterBy('ia')">IA</button>
                <button class="filter-btn" onclick="filterBy('crypto')">Crypto</button>
                <button class="filter-btn" onclick="filterBy('streaming')">Streaming</button>
                <button class="filter-btn" onclick="filterBy('business')">Business</button>
            </div>

            <div class="article-grid" id="article-grid">
                <!-- Articles will be injected here -->
            </div>
        </section>

        <!-- ArticleDetail Section -->
        <section id="article-view">
            <button class="back-btn" onclick="home()">← Retour aux articles</button>
            <div id="article-content">
                <!-- Single article content will be injected here -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-links">
                <a href="#">Twitter</a>
                <a href="#">YouTube</a>
                <a href="#">Discord</a>
                <a href="#">Contact</a>
            </div>
            <p class="copyright">&copy; 2026 TutoHub. Tous droits réservés.</p>
        </div>
    </footer>

    <!-- Back to Top -->
    <button id="back-to-top" onclick="scrollToTop()">↑</button>

    <script>
        /* --- DATA --- */
        const articles = [
            {
                id: 1,
                titre: "Comment utiliser ChatGPT pour automatiser vos tâches",
                categorie: "ia",
                date: "2026-05-20",
                resume: "Découvrez comment gagner du temps avec l'IA en créant des workflows automatisés avec ChatGPT et Zapier.",
                image: "https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=800&q=80",
                contenu: `
                    <h2>Introduction</h2>
                    <p>L'intelligence artificielle n'est plus une curiosité technologique, c'est un levier de productivité massif. Dans ce tutoriel, nous allons voir comment automatiser vos processus quotidiens.</p>
                    <h2>Étape 1 : Identifier les tâches répétitives</h2>
                    <p>La première étape consiste à lister tout ce que vous faites plus de 3 fois par jour. Rédaction d'emails, tri de données, synthèse de réunions...</p>
                    <h2>Étape 2 : Configurer un Prompt Efficace</h2>
                    <p>Pour que ChatGPT travaille pour vous, il lui faut des instructions claires.</p>
                    <pre><code>Exemple de prompt : "Agis en tant qu'assistant exécutif. Résume cet email et suggère 3 réponses possibles en tenant compte de mon ton habituel..."</code></pre>
                    <h2>Conclusion</h2>
                    <p>En couplant ces prompts avec des outils comme Make ou Zapier, vous pouvez créer de véritables agents autonomes.</p>
                `
            },
            {
                id: 2,
                titre: "Introduction à la DeFi : Comprendre les protocoles de prêt",
                categorie: "crypto",
                date: "2026-05-18",
                resume: "Tout savoir sur la finance décentralisée et comment générer des intérêts sur vos stablecoins en toute sécurité.",
                image: "https://images.unsplash.com/photo-1639762681485-074b7f938ba0?auto=format&fit=crop&w=800&q=80",
                contenu: `
                    <h2>Qu'est-ce que la DeFi ?</h2>
                    <p>La finance décentralisée (DeFi) utilise la blockchain pour supprimer les intermédiaires bancaires classiques.</p>
                    <h2>Fonctionnement d'Aave et Compound</h2>
                    <p>Ces protocoles permettent de prêter vos actifs à d'autres utilisateurs en échange d'un taux d'intérêt calculé algorithmiquement.</p>
                    <pre><code>// Concept de Smart Contract simplifié
if (collateral > loanValue) {
    executeLoan();
}</code></pre>
                    <h2>Les Risques</h2>
                    <p>N'oubliez jamais les risques de smart contracts et la volatilité du marché.</p>
                `
            },
            {
                id: 3,
                titre: "Optimiser OBS pour un stream 4K sans latence",
                categorie: "streaming",
                date: "2026-05-15",
                resume: "Les meilleurs réglages pour OBS Studio en 2026 afin d'obtenir une qualité d'image parfaite sur Twitch et YouTube.",
                image: "https://images.unsplash.com/photo-1593305841991-05c297ba4575?auto=format&fit=crop&w=800&q=80",
                contenu: `
                    <h2>Le Bitrate est la clé</h2>
                    <p>Pour streamer en 4K, vous aurez besoin d'une connexion fibre solide et d'un bitrate d'au moins 20 Mbps.</p>
                    <h2>Encodeur Hardware vs Software</h2>
                    <p>Utilisez toujours l'encodeur NVENC si vous avez une carte NVIDIA pour soulager votre processeur.</p>
                    <h2>Réglages Recommandés</h2>
                    <ul>
                        <li>Résolution : 3840x2160</li>
                        <li>FPS : 60</li>
                        <li>Profil : High</li>
                    </ul>
                `
            },
            {
                id: 4,
                titre: "5 Niches de Freelance qui vont exploser cette année",
                categorie: "business",
                date: "2026-05-10",
                resume: "Analyse du marché du travail en ligne : où se trouvent les opportunités les plus lucratives pour les indépendants.",
                image: "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=800&q=80",
                contenu: `
                    <h2>1. IA Prompt Engineer</h2>
                    <p>Aider les entreprises à intégrer l'IA dans leur workflow est une compétence extrêmement recherchée.</p>
                    <h2>2. Montage Vidéo Short-form</h2>
                    <p>Avec l'essor de TikTok et des Reels, la demande pour des monteurs rapides et créatifs ne faiblit pas.</p>
                    <h2>Conclusion</h2>
                    <p>Choisissez une niche, formez-vous pendant 30 jours et lancez votre offre sur Malt ou Upwork.</p>
                `
            }
        ];

        /* --- STATE --- */
        let currentFilter = 'all';
        let searchQuery = '';

        /* --- ELEMENTS --- */
        const articleGrid = document.getElementById('article-grid');
        const listView = document.getElementById('list-view');
        const articleView = document.getElementById('article-view');
        const articleContent = document.getElementById('article-content');
        const searchInput = document.getElementById('search-input');
        const burgerMenu = document.getElementById('burger-menu');
        const mobileMenu = document.getElementById('mobile-menu');
        const backToTop = document.getElementById('back-to-top');

        /* --- FUNCTIONS --- */

        function renderArticles() {
            const filtered = articles
                .filter(art => {
                    const matchesFilter = currentFilter === 'all' || art.categorie === currentFilter;
                    const matchesSearch = art.titre.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                         art.resume.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchesFilter && matchesSearch;
                })
                .sort((a, b) => new Date(b.date) - new Date(a.date));

            articleGrid.innerHTML = filtered.map(art => `
                <article class="card" onclick="viewArticle(${art.id})">
                    <div class="card-img" style="background-image: url('${art.image}')"></div>
                    <div class="card-content">
                        <div class="card-meta">
                            <span class="badge badge-${art.categorie}">${art.categorie}</span>
                            <span class="card-date">${formatDate(art.date)}</span>
                        </div>
                        <h2 class="card-title">${art.titre}</h2>
                        <p class="card-resume">${art.resume}</p>
                    </div>
                </article>
            `).join('');

            if (filtered.length === 0) {
                articleGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-muted);">Aucun article trouvé.</p>';
            }
        }

        function viewArticle(id) {
            const article = articles.find(a => a.id === id);
            if (!article) return;

            articleContent.innerHTML = `
                <div class="article-header">
                    <span class="badge badge-${article.categorie}">${article.categorie}</span>
                    <h1 style="font-size: 2.5rem; margin: 1rem 0;">${article.titre}</h1>
                    <p style="color: var(--text-muted);">Publié le ${formatDate(article.date)}</p>
                </div>
                <img src="${article.image}" alt="${article.titre}" style="width: 100%; border-radius: 12px; margin-bottom: 2rem;">
                <div class="article-full-content">
                    ${article.contenu}
                </div>
            `;

            listView.style.display = 'none';
            articleView.style.display = 'block';
            window.scrollTo(0, 0);
        }

        function home() {
            articleView.style.display = 'none';
            listView.style.display = 'block';
            window.scrollTo(0, 0);
        }

        function filterBy(cat) {
            currentFilter = cat;

            // Update active state in buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase() === cat || (cat === 'all' && btn.innerText === 'Tous'));
            });

            // Update active state in nav links
            document.querySelectorAll('.nav-links a').forEach(link => {
                link.classList.toggle('active', link.innerText.toLowerCase() === cat);
            });

            home(); // Back to list
            renderArticles();

            // Close mobile menu if open
            mobileMenu.classList.remove('show');
        }

        function formatDate(dateStr) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateStr).toLocaleDateString('fr-FR', options);
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /* --- EVENTS --- */

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            home();
            renderArticles();
        });

        burgerMenu.addEventListener('click', () => {
            mobileMenu.classList.toggle('show');
        });

        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                backToTop.classList.add('visible');
            } else {
                backToTop.classList.remove('visible');
            }
        });

        // Initialize
        renderArticles();

    </script>
</body>
</html>
